name: Guangtie
options:
  bundleIdPrefix: com.dsh
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  Guangtie:
    type: application
    platform: iOS
    sources:
      - path: Guangtie
      - path: ../assets
        type: folder
        name: assets
        buildPhase: resources
    info:
      path: Guangtie/Info.plist
      properties:
        CFBundleDisplayName: 广铁一号
        CFBundleShortVersionString: "2.1.8"
        CFBundleVersion: "127"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIViewControllerBasedStatusBarAppearance: true
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsh.ledger2
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Guangtie:
    build:
      targets:
        Guangtie: all
    run:
      config: Release
